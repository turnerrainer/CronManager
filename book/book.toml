[book]
title = "CronManager-on-Rust"
authors = ["Rainer Türner"]
description = "Reference for operators and third-party clients of CronManager-on-Rust."
language = "en"
src = "src"

[output.html]
default-theme = "light"
preferred-dark-theme = "light"
git-repository-url = "https://github.com/Buerostack/CronManager-on-Rust"
edit-url-template = "https://github.com/Buerostack/CronManager-on-Rust/edit/dev/book/{path}"
site-url = "/CronManager-on-Rust/"
additional-css = ["theme/custom.css"]

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1

[output.html.playground]
runnable = false

# Doc tests: mdbook-linkcheck fails the build on broken internal
# links (chapter-to-chapter). External URLs are skipped —
# `follow-web-links = false` — since CI would flake on rate-limited
# responses from github.com etc. Internal breakage is what matters
# and this is the fast, reliable check for it.
[output.linkcheck]
follow-web-links = false
warning-policy = "error"
