name: Publish container image

# Trigger on release tag push OR manual dispatch.
#
# Tag-push (the normal path):
#   v0.7.1         → stable release
#   v0.7.1-rc.1    → pre-release (rc / beta / alpha / preview / any suffix)
# The `derive version tags` step below reads which shape was pushed
# and chooses whether to move :latest and :major.minor accordingly.
#
# workflow_dispatch (the escape hatch):
#   Lets an operator re-run the publish workflow against an existing
#   tag from the Actions UI without cutting a new tag.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.1.0-rc.2). Must already exist on the repo."
        required: true
        type: string

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # `contents: write` because the `create-release` job below cuts
  # the GitHub Release once the container publish + smoke +
  # cosign sign steps succeed. Every other permission below is
  # unchanged from the previous shape.
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      # Derive the tag list. Two paths:
      #   * Stable release (`v0.7.1`):
      #       → push :0.7.1, :0.7, :latest
      #   * Pre-release  (`v0.7.1-rc.1`, ...):
      #       → push :0.7.1-rc.1 AND :<suffix-type> (e.g. :rc, :beta).
      #         Never move :latest or :0.7 from a pre-release.
      - name: Compose image tags
        id: meta
        env:
          TAG_REF: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_REF#v}"
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
            SUFFIX="${VERSION#*-}"
            SUFFIX_TYPE="${SUFFIX%%.*}"
            TAG_LINES=$(cat <<END
          ghcr.io/turnerrainer/cronmanager:$VERSION
          ghcr.io/turnerrainer/cronmanager:$SUFFIX_TYPE
          docker.io/turnerrainer/cronmanager:$VERSION
          docker.io/turnerrainer/cronmanager:$SUFFIX_TYPE
          END
          )
          else
            PRERELEASE=false
            MAJOR_MINOR="${VERSION%.*}"
            TAG_LINES=$(cat <<END
          ghcr.io/turnerrainer/cronmanager:$VERSION
          ghcr.io/turnerrainer/cronmanager:$MAJOR_MINOR
          ghcr.io/turnerrainer/cronmanager:latest
          docker.io/turnerrainer/cronmanager:$VERSION
          docker.io/turnerrainer/cronmanager:$MAJOR_MINOR
          docker.io/turnerrainer/cronmanager:latest
          END
          )
          fi
          echo "version=$VERSION"        >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE"  >> "$GITHUB_OUTPUT"
          {
            echo "tags<<END_OF_TAGS"
            echo "$TAG_LINES"
            echo "END_OF_TAGS"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing tags:"
          echo "$TAG_LINES"

      # SOURCE_DATE_EPOCH pins layer timestamps to the tag commit's
      # time. Buildx honours it with `rewrite-timestamp=true` below.
      - name: Compute SOURCE_DATE_EPOCH from commit time
        id: sde
        run: echo "epoch=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Repo secrets needed: DOCKERHUB_USERNAME + DOCKERHUB_TOKEN
      # (Read/Write/Delete scope). See STANDARDS.md §11.
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (multi-arch)
        id: build
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: ${{ steps.sde.outputs.epoch }}
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,push=true,rewrite-timestamp=true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          # `ignore-error=true` — cache-export failures on re-runs
          # / workflow_dispatch should not fail the publish.
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Trivy vulnerability scan (linux/amd64 layer)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: docker.io/turnerrainer/cronmanager@${{ steps.build.outputs.digest }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln

      # Smoke test each per-arch image. Docker keys locally-cached
      # images by digest, not (digest, platform), so we docker rmi
      # between iterations and pull explicitly with --platform.
      #
      # `CRONMANAGER_ADMIN_TOKEN` is required because the container
      # binds to 0.0.0.0:8080 and the C1 admin-gate refuses to start
      # on any non-loopback bind without a token (see book/src/
      # security.md). The token value here is smoke-only, never
      # touched by a real caller, and the container is torn down
      # after the /health probe.
      #
      # `--rm` was previously on the docker run — removed so we can
      # `docker logs` on failure. The explicit `docker rm -f` at
      # the end handles cleanup in the happy path.
      - name: Smoke test — /health on both arches
        env:
          IMAGE: docker.io/turnerrainer/cronmanager@${{ steps.build.outputs.digest }}
          SMOKE_TOKEN: smoke-only-token-not-a-real-secret-32chars
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64; do
            echo "::group::smoke test on ${platform}"
            docker image rm -f "${IMAGE}" >/dev/null 2>&1 || true
            docker pull --quiet --platform "${platform}" "${IMAGE}"
            cid="$(docker run -d --platform "${platform}" \
                   -p 18080:8080 \
                   -e CRONMANAGER_ADMIN_TOKEN="${SMOKE_TOKEN}" \
                   "${IMAGE}")"

            ok=0
            for i in $(seq 1 90); do
              if curl -sf http://localhost:18080/health >/dev/null; then
                echo "${platform}: /health OK after ${i}s"
                ok=1
                break
              fi
              sleep 1
            done

            if [ "${ok}" -ne 1 ]; then
              echo "::error::${platform}: /health did not respond within 90s"
              echo "--- container logs (${platform}) ---"
              docker logs "${cid}" || true
              echo "--- end container logs ---"
              docker rm -f "${cid}" >/dev/null 2>&1 || true
              exit 1
            fi

            docker rm -f "${cid}" >/dev/null
            echo "::endgroup::"
          done

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign published images (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          for registry_image in \
              ghcr.io/turnerrainer/cronmanager \
              docker.io/turnerrainer/cronmanager
          do
            echo "Signing ${registry_image}@${DIGEST}"
            cosign sign --yes "${registry_image}@${DIGEST}"
          done

  # Cut the GitHub Release once the container has been published,
  # smoke-tested, and signed. Runs on both tag-push and
  # workflow_dispatch paths — the latter lets an operator backfill
  # a missing Release for an already-tagged version.
  #
  # Every newly-cut release is marked `--latest` so it appears in
  # the repo landing-page sidebar Releases widget. GitHub's
  # `make_latest` field is independent of `prerelease` — a
  # pre-release CAN be the Latest, and for a pre-release-only
  # project (alpha / beta lines) that's what an operator visiting
  # the repo actually wants to see. When re-running against an
  # already-existing release, the "already exists" step edits the
  # release to promote it to Latest instead of skipping — so a
  # workflow_dispatch re-run after this job first shipped will
  # backfill the Latest badge on prior releases too.
  #
  # Release notes come from the CHANGELOG.md section for the tag's
  # version. The pre-release flag is set from the tag suffix (any
  # `vX.Y.Z-*` shape → pre-release).
  create-release:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Compute tag + version
        id: meta
        env:
          TAG_REF: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          TAG="$TAG_REF"
          VERSION="${TAG#v}"
          echo "tag=$TAG"           >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"   >> "$GITHUB_OUTPUT"

      # Detect whether the Release already exists — matters for
      # workflow_dispatch re-runs of an already-published tag. If
      # it exists, the "Promote existing Release to Latest" step
      # below runs; otherwise the create-flow steps run.
      - name: Check if Release already exists
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists — will promote to Latest"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # Extract the CHANGELOG section for this version. The
      # section runs from `## [X.Y.Z-suffix]` to the next `## [`
      # heading (exclusive). Fails hard if the section is missing
      # — a release without notes is a bug in the release-cutting
      # workflow, not something to silently paper over.
      - name: Extract release notes from CHANGELOG.md
        if: steps.exists.outputs.already == 'false'
        id: notes
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          NOTES_FILE="$RUNNER_TEMP/release-notes-${VERSION}.md"
          awk -v ver="$VERSION" '
            BEGIN { inside = 0 }
            /^## \[/ {
              if (inside) exit
              if ($0 ~ "^## \\[" ver "\\]") { inside = 1; next }
            }
            inside { print }
          ' CHANGELOG.md > "$NOTES_FILE"
          # Trim leading + trailing blank lines.
          sed -i -e '/./,$!d' -e ':a;/^\n*$/{$d;N;ba;}' "$NOTES_FILE"
          if [ ! -s "$NOTES_FILE" ]; then
            echo "::error::No CHANGELOG.md section found for version $VERSION"
            echo "Expected a heading like: ## [$VERSION] - YYYY-MM-DD"
            exit 1
          fi
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          echo "--- release notes ($VERSION) ---"
          cat "$NOTES_FILE"
          echo "--- end release notes ---"

      - name: Create GitHub Release (marks as Latest)
        if: steps.exists.outputs.already == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
        run: |
          set -euo pipefail
          # Every release is cut as a full release (never
          # `--prerelease`). GitHub's API rejects `--latest` on a
          # prerelease with HTTP 422 (`Latest release cannot be
          # draft or prerelease`) — the two flags are mutually
          # exclusive. This repo's convention (visible on
          # v0.2.1-alpha: `isPrerelease: false`, badged "Latest")
          # is that the version-string suffix (`-alpha` / `-beta` /
          # `-rc.N`) conveys stability meaning; GitHub's Latest
          # badge is the visibility signal. Both can coexist.
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$NOTES_FILE" \
            --verify-tag \
            --latest

      # workflow_dispatch re-run against an already-published tag:
      # the Release object already exists but may not carry the
      # Latest badge (e.g. a prior run before this pipeline gained
      # the `--latest` flag). Edit it in-place to promote to Latest;
      # notes stay whatever the operator or a prior workflow left
      # there.
      - name: Promote existing Release to Latest
        if: steps.exists.outputs.already == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          echo "Promoting existing Release $TAG to Latest"
          # `--prerelease=false` first — GitHub's API rejects
          # `--latest` on a prerelease with HTTP 422. This unsets
          # the flag on any Release that was mistakenly created as
          # a prerelease by a prior pipeline version, unblocking
          # the `--latest` promotion below. Idempotent for
          # already-non-prerelease targets.
          gh release edit "$TAG" --prerelease=false
          gh release edit "$TAG" --latest
