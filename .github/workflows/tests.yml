name: tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

# Both amd64 and native arm64 (free `ubuntu-24.04-arm` runners on
# public repos since 2025-04). Catches arch-specific bugs BEFORE
# publish.yml ships an arm64 container image. See STANDARDS.md §6.
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    services:
      # Real TimescaleDB. Per DEV-REQUIREMENTS §3: no mocking of
      # databases. Integration tests point CRONMANAGER_TEST_DATABASE_URL
      # at this service.
      timescaledb:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_DB: cronmanager_test
          POSTGRES_USER: cronmanager
          POSTGRES_PASSWORD: cronmanager_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cronmanager -d cronmanager_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      CRONMANAGER_TEST_DATABASE_URL: postgres://cronmanager:cronmanager_test_password@localhost:5432/cronmanager_test
    steps:
      - uses: actions/checkout@v5
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Namespace by arch — amd64 and arm64 target/ can't share.
          key: cargo-${{ matrix.runner }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.runner }}-
      - name: fmt check
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: build
        run: cargo build --release --locked --bin cronmanager
      - name: cargo test
        run: cargo test --release --no-fail-fast

  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install mdBook
        run: |
          MDBOOK_VERSION=0.4.40
          curl -sSL -o mdbook.tar.gz \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf mdbook.tar.gz -C /usr/local/bin/ mdbook
          rm mdbook.tar.gz
      - name: Install mdbook-linkcheck
        run: |
          MDLC_VERSION=0.7.7
          curl -sSL -o mdbook-linkcheck.zip \
            "https://github.com/Michael-F-Bryan/mdbook-linkcheck/releases/download/v${MDLC_VERSION}/mdbook-linkcheck.x86_64-unknown-linux-gnu.zip"
          unzip -o mdbook-linkcheck.zip -d /usr/local/bin/ mdbook-linkcheck
          chmod +x /usr/local/bin/mdbook-linkcheck
          rm mdbook-linkcheck.zip
      # Root CHANGELOG.md is the source of truth; book renders a
      # synced copy under reference/. Regenerate in CI so they
      # never drift.
      - name: Sync CHANGELOG into book
        run: cp CHANGELOG.md book/src/reference/changelog.md
      - name: Build book (fails on broken internal links)
        run: mdbook build book
